name: Construire l'APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet Capacitor
        run: |
          mkdir www
          cp index.html style.css app.js sources.js www/
          echo '{"appId":"com.mahmoh.actualites","appName":"Actualités du jour","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: actualites-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
